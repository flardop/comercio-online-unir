name: Tarea
description: Trabajo concreto que hay que realizar
title: "[Tarea] "
labels: ["tarea"]
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Explica con palabras sencillas qué debe quedar terminado.
      placeholder: Al terminar esta tarea, el usuario podrá...
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos o ideas
      description: Lista lo que crees que habrá que hacer.
  - type: textarea
    id: comprobar
    attributes:
      label: Cómo comprobarlo
      description: Explica qué debe hacer otra persona para verificar el resultado.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Parte del proyecto
      options:
        - Frontend
        - Backend
        - Base de datos
        - Documentación
        - Varias partes
    validations:
      required: true

